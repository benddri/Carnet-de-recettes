
<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carnet de recettes</title>

    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="js/main.js"></script>
</head>

<body class="bg-[#FFF9F2] min-h-screen text-gray-800">

    <!-- Header -->
    <header class="bg-gradient-to-r from-orange-500 to-amber-400 text-white">
        <div class="max-w-7xl mx-auto px-6 py-14 text-center">
            <p class="text-sm uppercase tracking-[0.3em] font-semibold mb-3 text-orange-100">
                Bienvenue dans votre cuisine
            </p>

            <h1 class="text-4xl md:text-5xl font-extrabold mb-4">
                🍽️ Carnet de recettes
            </h1>

            <p class="text-orange-50 text-lg max-w-xl mx-auto">
                Découvrez, recherchez et partagez vos recettes préférées.
            </p>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-5 md:px-8 py-12">

        <!-- Formulaire -->
        <section class="bg-white p-6 md:p-8 rounded-2xl shadow-lg border border-orange-100 mb-14">

            <div class="mb-8">
                <span class="text-orange-500 font-semibold text-sm uppercase tracking-wider">
                    Nouvelle recette
                </span>

                <h2 class="text-2xl md:text-3xl font-bold mt-2">
                    Ajouter une recette
                </h2>

                <p class="text-gray-500 mt-2">
                    Remplissez les informations pour ajouter votre recette.
                </p>
            </div>

            <form id="recipe-form">

                <div class="mb-5">
                    <label for="recipe-nom" class="block mb-2 font-semibold">
                        Nom de la recette
                    </label>

                    <input
                        type="text"
                        id="recipe-nom"
                        class="w-full border border-gray-200 rounded-xl p-3 outline-none focus:border-orange-400 focus:ring-2 focus:ring-orange-100 transition"
                        placeholder="Ex: Pizza Margherita"
                    >

                    <p id="name-error" class="text-red-500 text-sm mt-2"></p>
                </div>

                <div class="mb-5">
                    <label for="recipe-cuisine" class="block mb-2 font-semibold">
                        Cuisine
                    </label>

                    <input
                        type="text"
                        id="recipe-cuisine"
                        class="w-full border border-gray-200 rounded-xl p-3 outline-none focus:border-orange-400 focus:ring-2 focus:ring-orange-100 transition"
                        placeholder="Ex: Italian, Moroccan..."
                    >

                    <p id="cuisine-error" class="text-red-500 text-sm mt-2"></p>
                </div>

                <div class="mb-5">
                    <label for="difficulte" class="block mb-2 font-semibold">
                        Difficulté
                    </label>

                    <select
                        id="difficulte"
                        class="w-full border border-gray-200 rounded-xl p-3 bg-white outline-none focus:border-orange-400 focus:ring-2 focus:ring-orange-100 transition"
                    >
                        <option value="">Choisir une difficulté</option>
                        <option value="Easy">Facile</option>
                        <option value="Medium">Moyenne</option>
                        <option value="Hard">Difficile</option>
                    </select>

                    <p id="difficulte-error" class="text-red-500 text-sm mt-2"></p>
                </div>

                <div class="mb-6">
                    <label for="temps" class="block mb-2 font-semibold">
                        Temps de préparation (minutes)
                    </label>

                    <input
                        type="number"
                        id="temps"
                        min="1"
                        max="300"
                        class="w-full border border-gray-200 rounded-xl p-3 outline-none focus:border-orange-400 focus:ring-2 focus:ring-orange-100 transition"
                        placeholder="Ex: 30"
                    >

                    <p id="temps-error" class="text-red-500 text-sm mt-2"></p>
                </div>

                <button
                    type="submit"
                    id="add-recipe-btn"
                    class="w-full sm:w-auto bg-orange-500 hover:bg-orange-600 text-white px-8 py-3 rounded-xl font-bold shadow-md hover:shadow-lg transition duration-300"
                >
                    + Ajouter la recette
                </button>
                <p id="success-message" class="text-green-600 mt-3"></p>

            </form>
        </section>

        <!-- Liste des recettes -->
        <section id="recipes-section">

            <div class="mb-8">
                <span class="text-orange-500 font-semibold text-sm uppercase tracking-wider">
                    Notre collection
                </span>

                <div class="flex flex-col md:flex-row md:justify-between md:items-center gap-4 mt-2">

                    <h2 class="text-3xl font-extrabold">
                        Nos recettes
                    </h2>

                    <p
                        id="recipes-count"
                        class="bg-orange-100 text-orange-700 px-5 py-2 rounded-full font-semibold text-sm w-fit"
                    >
                        0 recettes
                    </p>

                </div>
            </div>

            <!-- Recherche -->
            <div class="flex flex-col sm:flex-row gap-3 mb-8">

                <input
                    type="text"
                    id="search-input"
                    class="flex-1 min-w-0 bg-white border border-gray-200 rounded-xl px-5 py-3 outline-none focus:border-orange-400 focus:ring-2 focus:ring-orange-100 transition"
                    placeholder="🔍 Rechercher une recette..."
                >

                <button
                    id="search-btn"
                    class="bg-gray-900 hover:bg-orange-600 text-white px-8 py-3 rounded-xl font-semibold transition duration-300"
                    type="button"
                >
                    Rechercher
                </button>

            </div>

            <!-- Cards -->
            <div
                id="recipes-list"
                class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-7"
            >
            </div>

        </section>

    </main>

    <!-- Footer -->
    <footer class="bg-gray-900 text-gray-300 text-center py-6 mt-16">
        <p class="text-sm">
            © 2026 Carnet de recettes — Fait avec ❤️
        </p>
    </footer>

</body>
</html>
