<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carnet de recettes</title>


    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="js/main.js"></script>
</head>

<body class="bg-yellow-100 min-h-screen">
    <header class="bg-orange-400 text-black text-center py-10 px-4">
        <h1 class="text-4xl font-bold mb-3">
            Carnet de recettes
        </h1>

        <p class="text-lg">
            Découvrez et partagez vos recettes préférées.
        </p>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-10">
        <section class="bg-amber-50 p-6 rounded-xl shadow-md mb-8">
            <h2 class="text-2xl font-bold mb-5">Ajouter une recette</h2>
            <form id="recipe-from">
                <div class="mb-4">
                    <label for="recipe-nom" class="block mb-2 font-semibold">
                        Nom de la recette :
                    </label>

                    <input type="text" id="recipe-nom" class="w-full border rounded-lg p-3"
                        placeholder="Entrez le nom de la recette">

                    <p id="name-error" class="text-red-500 text-sm mt-1"></p>
                </div>
                <div class="mb-4">
                    <label for="recipe-cuisine" class="block mb-2 font-semibold">
                        Cuisine :
                    </label>

                    <input type="text" id="recipe-cuisine" class="w-full border rounded-lg p-3"
                        placeholder="Ex: Italian, Moroccan...">

                    <p id="cuisine-error" class="text-red-500 text-sm mt-1"></p>
                </div>
                <div class="mb-4">
                    <label for="difficulte" class="block mb-2 font-semibold">
                        Difficulté :
                    </label>

                    <select id="difficulte" class="w-full border rounded-lg p-3">
                        <option value="">Choisir une difficulté</option>
                        <option value="Easy">Facile</option>
                        <option value="Medium">Moyenne</option>
                        <option value="Hard">Difficile</option>
                    </select>

                    <p id="difficulte-error" class="text-red-500 text-sm mt-1"></p>
                </div>
                <div class="mb-4">
                    <label for="temps" class="block mb-2 font-semibold">
                        Temps de préparation (minutes) :
                    </label>

                    <input type="number" id="temps" class="w-full border rounded-lg p-3" placeholder="Ex: 30" min="1"
                        max="300">

                    <p id="temps-error" class="text-red-500 text-sm mt-1"></p>
                </div>

                <button type="submit" id="add-recipe-btn" class="bg-orange-400 px-6 py-3 rounded-lg font-semibold">
                    Ajouter la recette
                </button>
            </form>
        </section>

        <section id="recipes-section">
            <div class=" gap-3 mb-4 mx-8  text-center">
                <input type="text" id="search-input" class="bg-amber-100  w-150 rounded-2xl px-4 py-3 border-3"
                    placeholder="Recherche une recette ...">
                <button id="search-btn" class="bg-orange-400  px-6 py-3 rounded-lg font-semibold">Recherche</button>
            </div>

            <div class="flex justify-between items-center mb-8">
                <h2 class="text-3xl font-bold text-gray-800">
                    Nos recettes
                </h2>

                <p id="recipes-count" class="bg-orange-400 text-black-500 px-4 py-2 rounded-full font-semibold">
                    0 recettes
                </p>
            </div>

            <div id="recipes-list" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            </div>


        </section>


    </main>

</body>

</html>
